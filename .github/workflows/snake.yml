name: Katkı Yılanı

on:
  schedule:
    - cron: "0 0 * * *"   # her gün gece yarısı (UTC) güncellenir
  workflow_dispatch:       # Actions sekmesinden elle de başlatılabilir
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Yılan SVG'lerini üret
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#C8102E&color_dots=#ebedf0,#f4b6bf,#e8768a,#d3394f,#a50e24
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#E03A4E&color_dots=#161b22,#4a0b14,#7a0b1c,#a50e24,#e03a4e

      - name: output dalına yayınla
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
